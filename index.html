<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Mural Académico</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Lora:ital,wght@0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #100d0a;
      --panel: #18130f;
      --panel-raised: #201914;
      --card-bg: #18130f;
      --border: #2a211a;
      --border-accent: #3b2e23;
      --brass: #bfa054;
      --brass-muted: #8c723b;
      --parchment: #eee7dd;
      --muted: #a39587;
      --muted-dark: #6e6052;
      --font-display: 'Lora', Georgia, serif;
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --radius: 12px;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { min-height: 100vh; }
    body {
      background-color: var(--bg);
      color: var(--parchment);
      font-family: var(--font-sans);
      line-height: 1.5;
      padding: 24px 16px 64px;
    }

    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; border: none; background: none; }

    .app {
      max-width: 1060px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Topbar */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: #18130f;
      border: 1px solid var(--brass-muted);
      color: var(--brass);
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .brand h1 {
      font-family: var(--font-display);
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--parchment);
    }

    .brand p {
      font-size: 0.78rem;
      color: var(--muted);
      letter-spacing: 0.01em;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 9px 15px;
      border-radius: var(--radius);
      font-size: 0.84rem;
      font-weight: 600;
      transition: background 0.15s ease, border-color 0.15s ease;
      min-height: 42px;
    }

    .btn-secondary {
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--parchment);
    }
    .btn-secondary:hover {
      background: var(--panel-raised);
      border-color: var(--brass-muted);
    }

    .btn-primary {
      background: var(--brass);
      color: #1a1309;
      font-weight: 700;
      border: 1px solid var(--brass);
    }
    .btn-primary:hover {
      background: #cfb164;
    }

    /* Grelha de Indicadores KPI */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .kpi-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 115px;
    }

    .kpi-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .kpi-label {
      font-family: var(--font-display);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .kpi-icon {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      background: #201913;
      border: 1px solid var(--border-accent);
      color: var(--muted);
      display: grid;
      place-items: center;
    }

    .kpi-value-row {
      display: flex;
      align-items: baseline;
      gap: 7px;
      margin-bottom: 4px;
    }

    .kpi-value {
      font-family: var(--font-display);
      font-size: 1.65rem;
      font-weight: 700;
      color: var(--parchment);
      line-height: 1;
    }

    .kpi-caption {
      font-size: 0.78rem;
      color: var(--muted);
    }

    .kpi-footer {
      font-size: 0.72rem;
      color: var(--muted-dark);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .kpi-footer .bullet {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--brass-muted);
    }

    .progress-bar-wrap {
      width: 100%;
      height: 4px;
      background: #231c16;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 6px;
    }

    .progress-fill {
      height: 100%;
      background: var(--brass);
      border-radius: 999px;
      width: 0%;
      transition: width 0.3s ease;
    }

    /* Barra de Ferramentas */
    .toolbar {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .search-box {
      flex: 1;
      min-width: 220px;
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-icon {
      position: absolute;
      left: 12px;
      color: var(--muted);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      background: #110e0b;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px 10px 38px;
      color: var(--parchment);
      font-size: 0.88rem;
      outline: none;
      min-height: 42px;
    }
    .search-input:focus {
      border-color: var(--brass-muted);
    }

    /* Seletor Customizado */
    .custom-select-container {
      position: relative;
      min-width: 200px;
    }

    .custom-select-trigger {
      width: 100%;
      min-height: 42px;
      background: #110e0b;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--parchment);
      font-size: 0.86rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
      user-select: none;
      transition: border-color 0.15s ease;
    }

    .custom-select-trigger:focus,
    .custom-select-trigger.active {
      border-color: var(--brass-muted);
    }

    .custom-select-trigger .chevron {
      color: var(--muted);
      transition: transform 0.2s ease;
      flex-shrink: 0;
    }

    .custom-select-trigger.active .chevron {
      transform: rotate(180deg);
    }

    .custom-select-menu {
      display: none;
      position: absolute;
      top: calc(100% + 5px);
      left: 0;
      right: 0;
      background: #18130f;
      border: 1px solid var(--border-accent);
      border-radius: 8px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.7);
      max-height: 240px;
      overflow-y: auto;
      z-index: 100;
      padding: 4px;
    }

    .custom-select-menu.open {
      display: block;
    }

    .custom-select-option {
      padding: 9px 12px;
      font-size: 0.84rem;
      border-radius: 6px;
      color: var(--parchment);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: background 0.12s ease, color 0.12s ease;
    }

    .custom-select-option:hover {
      background: #241c15;
      color: var(--brass);
    }

    .custom-select-option.selected {
      background: #241c15;
      color: var(--brass);
      font-weight: 600;
    }

    /* Separadores de Navegação */
    .tabs-wrapper {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      border-bottom: 1px solid var(--border);
    }
    .tabs-wrapper::-webkit-scrollbar { display: none; }

    .tabs {
      display: flex;
      gap: 6px;
      padding-bottom: 4px;
      width: max-content;
      min-width: 100%;
    }

    .tab-btn {
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--muted);
      white-space: nowrap;
      transition: 0.15s ease;
      min-height: 38px;
    }

    .tab-btn:hover {
      color: var(--parchment);
      background: var(--panel);
    }

    .tab-btn.active {
      color: var(--brass);
      background: var(--panel);
      border: 1px solid var(--border-accent);
    }

    /* Grelha de Atividades */
    .activity-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 12px;
    }

    .activity-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
      transition: border-color 0.15s ease;
    }

    .activity-card:hover {
      border-color: var(--border-accent);
    }

    .activity-card.done {
      border-color: #1f2f25;
      background: #121915;
    }

    .activity-card.expired {
      opacity: 0.55;
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .subject-tag {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--brass);
      margin-bottom: 3px;
    }

    .card-title {
      font-family: var(--font-display);
      font-size: 1.02rem;
      font-weight: 600;
      color: var(--parchment);
      line-height: 1.35;
    }

    .score-badge {
      font-family: var(--font-mono);
      font-size: 0.74rem;
      padding: 3px 7px;
      border-radius: 6px;
      background: #201913;
      border: 1px solid var(--border-accent);
      color: var(--parchment);
      white-space: nowrap;
    }

    .card-desc {
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 1.45;
    }

    /* Respiro corrigido para descolar os retângulos da linha divisória */
    .meta-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 14px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.72rem;
      font-family: var(--font-mono);
      padding: 4px 8px;
      border-radius: 6px;
      background: #201913;
      border: 1px solid var(--border);
      color: var(--muted);
    }

    .tag.modality {
      color: var(--parchment);
      border-color: var(--border-accent);
    }

    /* Linha divisória com espaçamento e clareza */
    .card-footer {
      border-top: 1px solid var(--border);
      padding-top: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .check-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      min-height: 38px;
    }

    .check-box {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      border: 1px solid var(--border-accent);
      background: #120e0b;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .check-btn.checked {
      color: #79a688;
    }

    .check-btn.checked .check-box {
      background: #244230;
      border-color: #3f684e;
      color: #9cd3ae;
    }

    .del-btn {
      color: var(--muted-dark);
      padding: 8px;
      border-radius: 6px;
      min-width: 36px;
      min-height: 36px;
      display: grid;
      place-items: center;
      transition: 0.15s;
    }
    .del-btn:hover {
      color: #c46853;
      background: #241512;
    }

    .empty-state {
      text-align: center;
      padding: 40px 16px;
      background: var(--panel);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      color: var(--muted);
    }

    /* Modais */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(10, 8, 6, 0.85);
      backdrop-filter: blur(4px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-backdrop.open { display: flex; }

    .modal {
      width: min(540px, 100%);
      background: #18130f;
      border: 1px solid var(--border-accent);
      border-radius: var(--radius);
      padding: 22px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7);
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .modal-head h3 {
      font-family: var(--font-display);
      font-size: 1.12rem;
      font-weight: 600;
      color: var(--parchment);
    }

    .icon-close {
      color: var(--muted);
      padding: 8px;
      border-radius: 6px;
      min-width: 36px;
      min-height: 36px;
      display: grid;
      place-items: center;
    }
    .icon-close:hover {
      color: var(--parchment);
      background: #231c16;
    }

    .field-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .field.full { grid-column: 1 / -1; }

    .field label {
      font-size: 0.76rem;
      font-family: var(--font-mono);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
    }

    .field input, .field select, .field textarea {
      background: #110e0b;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--parchment);
      font-size: 0.88rem;
      outline: none;
      min-height: 42px;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      border-color: var(--brass-muted);
    }

    .field textarea {
      resize: vertical;
      min-height: 75px;
    }

    .modal-foot {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    /* Otimização Mobile */
    @media (max-width: 768px) {
      body {
        padding: 16px 12px 48px;
      }

      .brand p {
        display: none;
      }

      .brand h1 {
        font-size: 1.15rem;
      }

      .kpi-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .kpi-card {
        padding: 14px;
        min-height: 105px;
      }

      .kpi-value {
        font-size: 1.45rem;
      }

      .toolbar {
        flex-direction: column;
        align-items: stretch;
      }

      .search-box, .custom-select-container {
        width: 100%;
        min-width: 100%;
      }

      .activity-grid {
        grid-template-columns: 1fr;
      }

      .modal-backdrop {
        padding: 0;
        align-items: flex-end;
      }

      .modal {
        border-radius: 16px 16px 0 0;
        max-height: 90vh;
        overflow-y: auto;
        padding: 20px 16px 24px;
      }

      .field-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- Topbar -->
    <header class="topbar">
      <div class="brand">
        <div class="brand-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/>
            <path d="M6 6h10M6 10h10M6 14h6"/>
          </svg>
        </div>
        <div>
          <h1>Mural Académico</h1>
          <p>Gestão sóbria de prazos e compromissos</p>
        </div>
      </div>

      <div class="actions">
        <button class="btn btn-secondary" id="authBtn" title="Entrar no mural">
          <span id="authBtnLabel">Entrar</span>
        </button>
        <button class="btn btn-secondary" id="logoutBtn" title="Sair da conta" hidden>Sair</button>
        <button class="btn btn-secondary" id="exportBtn" title="Exportar Backup JSON">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>
          </svg>
          Backup
        </button>
        <button class="btn btn-primary" id="openAddModal">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 5v14M5 12h14"/>
          </svg>
          Novo
        </button>
      </div>
    </header>

    <!-- Indicadores KPI -->
    <section class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-header">
          <span class="kpi-label">Pendentes</span>
          <div class="kpi-icon">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
              <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
            </svg>
          </div>
        </div>
        <div class="kpi-value-row">
          <span class="kpi-value" id="kpiPending">0</span>
          <span class="kpi-caption">em curso</span>
        </div>
        <div class="kpi-footer">
          <span class="bullet"></span> Caderno ativo
        </div>
      </div>

      <div class="kpi-card">
        <div class="kpi-header">
          <span class="kpi-label">Próximos</span>
          <div class="kpi-icon">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <circle cx="12" cy="12" r="10"/>
              <polyline points="12 6 12 12 16 14"/>
            </svg>
          </div>
        </div>
        <div class="kpi-value-row">
          <span class="kpi-value" id="kpiSoon">0</span>
          <span class="kpi-caption">&le; 48 horas</span>
        </div>
        <div class="kpi-footer">
          <span class="bullet"></span> Atenção imediata
        </div>
      </div>

      <div class="kpi-card">
        <div class="kpi-header">
          <span class="kpi-label">Pontos</span>
          <div class="kpi-icon">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
            </svg>
          </div>
        </div>
        <div class="kpi-value-row">
          <span class="kpi-value" id="kpiScore">0</span>
          <span class="kpi-caption">na média</span>
        </div>
        <div class="kpi-footer">
          <span class="bullet"></span> Em aberto
        </div>
      </div>

      <div class="kpi-card">
        <div class="kpi-header">
          <span class="kpi-label">Concluídas</span>
          <div class="kpi-icon">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
              <polyline points="22 4 12 14.01 9 11.01"/>
            </svg>
          </div>
        </div>
        <div class="kpi-value-row">
          <span class="kpi-value" id="kpiDone">0</span>
          <span class="kpi-caption" id="kpiRate">0%</span>
        </div>
        <div class="progress-bar-wrap">
          <div class="progress-fill" id="kpiProgress"></div>
        </div>
      </div>
    </section>

    <!-- Barra de Ferramentas -->
    <div class="toolbar">
      <div class="search-box">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" id="searchInput" class="search-input" placeholder="Pesquisar disciplina ou trabalho..." />
      </div>

      <!-- Seletor de Disciplinas Customizado -->
      <div class="custom-select-container" id="customSelectWrapper">
        <button type="button" class="custom-select-trigger" id="customSelectTrigger">
          <span id="selectedSubjectLabel">Todas as disciplinas</span>
          <svg class="chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </button>
        <div class="custom-select-menu" id="customSelectMenu"></div>
      </div>
    </div>

    <!-- Separadores com Scroll Suave no Telemóvel -->
    <div class="tabs-wrapper">
      <nav class="tabs">
        <button class="tab-btn active" data-filter="all">Todas as Atividades</button>
        <button class="tab-btn" data-filter="pending">Pendentes</button>
        <button class="tab-btn" data-filter="done">Concluídas</button>
        <button class="tab-btn" data-filter="expired">Encerradas</button>
      </nav>
    </div>

    <!-- Lista de Atividades -->
    <section class="activity-grid" id="activityList"></section>
  </div>

  <!-- Modal Adicionar Atividade -->
  <div class="modal-backdrop" id="addModal">
    <div class="modal">
      <div class="modal-head">
        <h3>Registar Atividade</h3>
        <button class="icon-close" id="closeAddModal">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <form id="activityForm">
        <div class="field-grid">
          <div class="field full">
            <label for="actTitle">Título da Atividade</label>
            <input type="text" id="actTitle" required placeholder="Ex.: Relatório de Base de Dados" />
          </div>

          <div class="field">
            <label for="actSubject">Disciplina</label>
            <input type="text" id="actSubject" required placeholder="Ex.: Base de Dados" />
          </div>

          <div class="field">
            <label for="actType">Tipo</label>
            <select id="actType">
              <option>Exercício</option>
              <option>Trabalho</option>
              <option>Seminário</option>
              <option>Frequência / Exame</option>
              <option>Projeto</option>
            </select>
          </div>

          <div class="field">
            <label for="actModality">Modalidade</label>
            <select id="actModality">
              <option value="Individual">Individual</option>
              <option value="Em dupla">Em dupla</option>
              <option value="Em grupo">Em grupo</option>
            </select>
          </div>

          <div class="field">
            <label for="actDue">Prazo Limite</label>
            <input type="datetime-local" id="actDue" required />
          </div>

          <div class="field full">
            <label for="actPoints">Pontuação (valores)</label>
            <input type="number" id="actPoints" min="0" step="0.1" placeholder="Opcional" />
          </div>

          <div class="field full">
            <label for="actDesc">Instruções / Notas</label>
            <textarea id="actDesc" placeholder="Observações de entrega, integrantes da equipa, referências..."></textarea>
          </div>
        </div>

        <div class="modal-foot">
          <button type="button" class="btn btn-secondary" id="cancelAddModal">Cancelar</button>
          <button type="submit" class="btn btn-primary">Registar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Login -->
  <div class="modal-backdrop" id="authModal">
    <div class="modal" style="max-width: 420px;">
      <div class="modal-head">
        <h3>Entrar no Mural</h3>
        <button class="icon-close" id="closeAuthModal" aria-label="Fechar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <form id="authForm">
        <div class="field">
          <label for="authEmail">E-mail</label>
          <input type="email" id="authEmail" required placeholder="seuemail@exemplo.com" autocomplete="email" />
        </div>
        <p id="authMessage" style="margin-top: 10px; font-size: .78rem; color: var(--muted); line-height: 1.45;">
          Você receberá um link de acesso por e-mail. Não precisa criar senha.
        </p>
        <div class="modal-foot">
          <button type="button" class="btn btn-secondary" id="cancelAuthModal">Cancelar</button>
          <button type="submit" class="btn btn-primary">Enviar link</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { createClient } from "@supabase/supabase-js";

    const supabaseClient = createClient(
      import.meta.env.VITE_SUPABASE_URL,
      import.meta.env.VITE_SUPABASE_PUBLISHABLE_KEY
    );

    const STORE_KEY = "mural_academico_sober_v3";
    const DONE_KEY = "mural_academico_done_v3";

    function futureDate(days, hour = 23, minute = 59) {
      const d = new Date();
      d.setDate(d.getDate() + days);
      d.setHours(hour, minute, 0, 0);
      return d.toISOString();
    }

    function pastDate(days) {
      const d = new Date();
      d.setDate(d.getDate() - days);
      return d.toISOString();
    }

    const initialData = [
      {
        id: crypto.randomUUID(),
        title: "Normalização e Álgebra Relacional",
        subject: "Banco de Dados",
        type: "Exercício",
        modality: "Individual",
        due: futureDate(3),
        points: 2.5,
        description: "Exercícios práticos de 1FN a Boyce-Codd."
      },
      {
        id: crypto.randomUUID(),
        title: "Treinamento de Redes Neuronais",
        subject: "Inteligência Artificial",
        type: "Trabalho",
        modality: "Em dupla",
        due: futureDate(1, 19, 0),
        points: 3.0,
        description: "Implementação e teste do algoritmo de retropropagação."
      },
      {
        id: crypto.randomUUID(),
        title: "Arquitetura de Microsserviços",
        subject: "Sistemas Distribuídos",
        type: "Projeto",
        modality: "Em grupo",
        due: pastDate(2),
        points: 4.0,
        description: "Relatório de implementação e testes de escalabilidade em nuvem."
      }
    ];

    let activities = [];
    let doneIds = new Set();
    let activeFilter = "all";
    let selectedSubject = "";
    let currentUser = null;

    const $ = s => document.querySelector(s);
    const $$ = s => [...document.querySelectorAll(s)];

    async function loadActivities() {
      const { data, error } = await supabaseClient
        .from("activities")
        .select("*")
        .order("due_at", { ascending: true });

      if (error) {
        console.error("Falha ao carregar atividades:", error);
        activities = [];
      } else {
        activities = (data || []).map(a => ({
          ...a,
          due: a.due_at
        }));
      }

      doneIds = new Set();

      if (currentUser) {
        const { data: completionData, error: completionError } = await supabaseClient
          .from("activity_completions")
          .select("activity_id")
          .eq("user_id", currentUser.id);

        if (completionError) {
          console.error("Falha ao carregar conclusões:", completionError);
        } else {
          doneIds = new Set((completionData || []).map(item => item.activity_id));
        }
      }

      renderList();
    }

    function updateAuthUI() {
      $("#authBtnLabel").textContent = currentUser?.email || "Entrar";
      $("#logoutBtn").hidden = !currentUser;
    }

    function requireLogin() {
      if (currentUser) return true;
      $("#authMessage").textContent = "Entre com seu e-mail para alterar o mural ou marcar uma atividade como concluída.";
      $("#authModal").classList.add("open");
      return false;
    }

    function escapeHtml(str = "") {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatDate(iso) {
      const d = new Date(iso);
      return new Intl.DateTimeFormat("pt-PT", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      }).format(d);
    }

    function getDueInfo(iso) {
      const diff = new Date(iso) - new Date();
      if (diff < 0) return { status: "expired", text: "Encerrado" };
      const hours = diff / 3600000;
      const days = diff / 86400000;
      if (hours <= 24) return { status: "soon", text: "Termina hoje" };
      if (days <= 2) return { status: "soon", text: `Faltam ${Math.ceil(days)} dias` };
      return { status: "normal", text: `Faltam ${Math.ceil(days)} dias` };
    }

    function getModalityIcon(modality) {
      if (modality === "Em grupo") {
        return `
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
        `;
      }
      if (modality === "Em dupla") {
        return `
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
        `;
      }
      // Individual padrão
      return `
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      `;
    }

    function updateKpis() {
      const pending = activities.filter(a => !doneIds.has(a.id) && getDueInfo(a.due).status !== "expired");
      const soon = pending.filter(a => getDueInfo(a.due).status === "soon");
      const done = activities.filter(a => doneIds.has(a.id));
      const totalPoints = pending.reduce((acc, a) => acc + (Number(a.points) || 0), 0);
      const rate = activities.length ? Math.round((done.length / activities.length) * 100) : 0;

      $("#kpiPending").textContent = pending.length;
      $("#kpiSoon").textContent = soon.length;
      $("#kpiScore").textContent = totalPoints.toLocaleString("pt-PT", { maximumFractionDigits: 1 });
      $("#kpiDone").textContent = done.length;
      $("#kpiRate").textContent = `${rate}% concluído`;
      $("#kpiProgress").style.width = `${rate}%`;
    }

    // Gestor do Menu Suspenso
    const customSelectWrapper = $("#customSelectWrapper");
    const customSelectTrigger = $("#customSelectTrigger");
    const customSelectMenu = $("#customSelectMenu");
    const selectedSubjectLabel = $("#selectedSubjectLabel");

    function renderSubjectOptions() {
      const subjects = [...new Set(activities.map(a => a.subject))].sort((a, b) => a.localeCompare(b));
      
      let html = `
        <div class="custom-select-option ${selectedSubject === "" ? 'selected' : ''}" data-val="">
          Todas as disciplinas
        </div>
      `;

      subjects.forEach(sub => {
        const isSelected = selectedSubject === sub;
        html += `
          <div class="custom-select-option ${isSelected ? 'selected' : ''}" data-val="${escapeHtml(sub)}">
            ${escapeHtml(sub)}
          </div>
        `;
      });

      customSelectMenu.innerHTML = html;
      selectedSubjectLabel.textContent = selectedSubject || "Todas as disciplinas";

      $$(".custom-select-option").forEach(opt => {
        opt.addEventListener("click", () => {
          selectedSubject = opt.dataset.val;
          selectedSubjectLabel.textContent = selectedSubject || "Todas as disciplinas";
          closeCustomSelect();
          renderList();
        });
      });
    }

    function toggleCustomSelect() {
      const isOpen = customSelectMenu.classList.contains("open");
      if (isOpen) closeCustomSelect();
      else openCustomSelect();
    }

    function openCustomSelect() {
      customSelectMenu.classList.add("open");
      customSelectTrigger.classList.add("active");
    }

    function closeCustomSelect() {
      customSelectMenu.classList.remove("open");
      customSelectTrigger.classList.remove("active");
    }

    customSelectTrigger.addEventListener("click", (e) => {
      e.stopPropagation();
      toggleCustomSelect();
    });

    document.addEventListener("click", (e) => {
      if (!customSelectWrapper.contains(e.target)) {
        closeCustomSelect();
      }
    });

    function renderList() {
      renderSubjectOptions();
      updateKpis();

      const search = $("#searchInput").value.trim().toLowerCase();
      const container = $("#activityList");

      const filtered = activities.filter(a => {
        const info = getDueInfo(a.due);
        const isDone = doneIds.has(a.id);

        if (activeFilter === "pending" && (isDone || info.status === "expired")) return false;
        if (activeFilter === "done" && !isDone) return false;
        if (activeFilter === "expired" && info.status !== "expired") return false;
        if (selectedSubject && a.subject !== selectedSubject) return false;

        if (search) {
          const hay = `${a.title} ${a.subject} ${a.modality || ""} ${a.description || ""}`.toLowerCase();
          if (!hay.includes(search)) return false;
        }
        return true;
      }).sort((a, b) => new Date(a.due) - new Date(b.due));

      if (!filtered.length) {
        container.innerHTML = '<div class="empty-state" style="grid-column: 1 / -1;">Nenhuma atividade localizada no fichamento.</div>';
        return;
      }

      container.innerHTML = filtered.map(a => {
        const info = getDueInfo(a.due);
        const isDone = doneIds.has(a.id);
        const modality = a.modality || "Individual";
        const cardClass = [
          "activity-card",
          isDone ? "done" : "",
          info.status === "expired" ? "expired" : ""
        ].filter(Boolean).join(" ");

        return `
          <article class="${cardClass}">
            <div>
              <div class="card-top">
                <div>
                  <div class="subject-tag">${escapeHtml(a.subject)}</div>
                  <h4 class="card-title">${escapeHtml(a.title)}</h4>
                </div>
                ${a.points !== null && a.points !== "" && a.points !== undefined
                  ? `<div class="score-badge">${Number(a.points).toLocaleString("pt-PT")} pts</div>`
                  : ""}
              </div>

              ${a.description ? `<p class="card-desc" style="margin-top: 8px;">${escapeHtml(a.description)}</p>` : ""}
            </div>

            <div>
              <div class="meta-tags">
                <span class="tag">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                    <line x1="16" y1="2" x2="16" y2="6"/>
                    <line x1="8" y1="2" x2="8" y2="6"/>
                    <line x1="3" y1="10" x2="21" y2="10"/>
                  </svg>
                  ${formatDate(a.due)}
                </span>
                <span class="tag">${escapeHtml(a.type)}</span>
                <span class="tag modality" title="Modalidade da atividade">
                  ${getModalityIcon(modality)}
                  ${escapeHtml(modality)}
                </span>
                <span class="tag">${info.text}</span>
              </div>

              <div class="card-footer">
                <button class="check-btn ${isDone ? 'checked' : ''}" data-check="${a.id}">
                  <span class="check-box">
                    ${isDone ? `
                      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                        <polyline points="20 6 9 17 4 12"/>
                      </svg>
                    ` : ''}
                  </span>
                  <span>${isDone ? "Concluída" : "Marcar como feita"}</span>
                </button>

                <button class="del-btn" data-delete="${a.id}" title="Excluir">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="3 6 5 6 21 6"/>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                  </svg>
                </button>
              </div>
            </div>
          </article>
        `;
      }).join("");

      $$("[data-check]").forEach(btn => {
        btn.addEventListener("click", async () => {
          if (!requireLogin()) return;

          const id = btn.dataset.check;
          const isDone = doneIds.has(id);

          const result = isDone
            ? await supabaseClient
                .from("activity_completions")
                .delete()
                .eq("user_id", currentUser.id)
                .eq("activity_id", id)
            : await supabaseClient
                .from("activity_completions")
                .insert({
                  user_id: currentUser.id,
                  activity_id: id
                });

          if (result.error) {
            console.error(result.error);
            alert("Não foi possível atualizar esta atividade.");
            return;
          }

          await loadActivities();
        });
      });

      $$("[data-delete]").forEach(btn => {
        btn.addEventListener("click", async () => {
          if (!requireLogin()) return;

          const id = btn.dataset.delete;
          const { error } = await supabaseClient
            .from("activities")
            .delete()
            .eq("id", id);

          if (error) {
            console.error(error);
            alert("Você não tem permissão para excluir esta atividade.");
            return;
          }

          await loadActivities();
        });
      });
    }

    // Janelas Modais
    const addModal = $("#addModal");
    const authModal = $("#authModal");

    $("#openAddModal").addEventListener("click", () => {
      if (!requireLogin()) return;
      addModal.classList.add("open");
    });

    $("#closeAddModal").addEventListener("click", () => addModal.classList.remove("open"));
    $("#cancelAddModal").addEventListener("click", () => addModal.classList.remove("open"));

    $("#authBtn").addEventListener("click", () => {
      if (currentUser) return;
      $("#authMessage").textContent = "Você receberá um link de acesso por e-mail. Não precisa criar senha.";
      authModal.classList.add("open");
    });

    $("#closeAuthModal").addEventListener("click", () => authModal.classList.remove("open"));
    $("#cancelAuthModal").addEventListener("click", () => authModal.classList.remove("open"));

    $("#logoutBtn").addEventListener("click", async () => {
      await supabaseClient.auth.signOut();
    });

    $("#authForm").addEventListener("submit", async e => {
      e.preventDefault();
      const email = $("#authEmail").value.trim();
      if (!email) return;

      $("#authMessage").textContent = "Enviando link de acesso...";

      const { error } = await supabaseClient.auth.signInWithOtp({
        email,
        options: {
          emailRedirectTo: window.location.origin
        }
      });

      if (error) {
        console.error(error);
        $("#authMessage").textContent = "Não foi possível enviar o link. Verifique o e-mail e tente novamente.";
        return;
      }

      $("#authMessage").textContent = "Link enviado. Abra seu e-mail e toque no link para entrar.";
    });

    supabaseClient.auth.onAuthStateChange(async (_event, session) => {
      currentUser = session?.user || null;
      updateAuthUI();
      await loadActivities();

      if (currentUser) authModal.classList.remove("open");
    });

    $("#activityForm").addEventListener("submit", async e => {
      e.preventDefault();
      if (!requireLogin()) return;

      const rawDue = $("#actDue").value;
      if (!rawDue) return;

      const { error } = await supabaseClient
        .from("activities")
        .insert({
          title: $("#actTitle").value.trim(),
          subject: $("#actSubject").value.trim(),
          type: $("#actType").value,
          modality: $("#actModality").value,
          due_at: new Date(rawDue).toISOString(),
          points: $("#actPoints").value === "" ? null : Number($("#actPoints").value),
          description: $("#actDesc").value.trim(),
          created_by: currentUser.id
        });

      if (error) {
        console.error(error);
        alert("Não foi possível registrar a atividade.");
        return;
      }

      e.target.reset();
      addModal.classList.remove("open");
      await loadActivities();
    });

    // Filtros e Pesquisa
    $("#searchInput").addEventListener("input", renderList);

    $$(".tab-btn").forEach(tab => {       tab.addEventListener("click", () => {         $$
(".tab-btn").forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
        activeFilter = tab.dataset.filter;
        renderList();
      });
    });

    // Cópia de Segurança JSON
    $("#exportBtn").addEventListener("click", () => {
      const payload = JSON.stringify({ activities, doneIds: [...doneIds] }, null, 2);
      const blob = new Blob([payload], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `mural_academico_${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    });

    // Teclas de Atalho
    window.addEventListener("keydown", e => {
      if (e.key === "Escape") {
        addModal.classList.remove("open");
        authModal.classList.remove("open");
        closeCustomSelect();
      }

      if ((e.key === "n" || e.key === "N") && !["INPUT", "TEXTAREA"].includes(document.activeElement.tagName)) {
        e.preventDefault();
        if (requireLogin()) addModal.classList.add("open");
      }
    });

    async function initializeApp() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      currentUser = session?.user || null;
      updateAuthUI();
      await loadActivities();
    }

    initializeApp();
  </script>
</body>
</html>
